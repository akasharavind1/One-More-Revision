spring.datasource.url=jdbc:postgresql://localhost:5432/OneMoreRevision
spring.datasource.username=admin
spring.datasource.password=admin

# Set true once, restart the backend to wipe categories/subcategories/questions/notes (users kept), then set false.
#app.data.wipe-except-users=true

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

server.port=8080

app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-at-least-32-bytes-long}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:7653}

logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.example.interviewtracker=DEBUG